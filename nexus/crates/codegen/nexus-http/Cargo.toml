[package]
license = "Apache-2.0"
name = "nexus-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the nexus CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
nexus-auth = { workspace = true, features = ["middleware"] }
nexus-sampler = { path = "../nexus-sampler" }
nexus-telemetry = { workspace = true }
nexus-version = { workspace = true }
nexus-workspace = { workspace = true }

[lints]
workspace = true
