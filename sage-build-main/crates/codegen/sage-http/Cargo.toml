[package]
license = "Apache-2.0"
name = "sage-http"
version = "0.1.0"
edition.workspace = true
description = "Shared reqwest HTTP clients and User-Agent construction for the sage CLI."

[dependencies]
reqwest = { workspace = true, features = ["blocking"] }
reqwest-middleware = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sage-auth = { workspace = true, features = ["middleware"] }
sage-sampler = { path = "../sage-sampler" }
sage-telemetry = { workspace = true }
sage-version = { workspace = true }
sage-workspace = { workspace = true }

[lints]
workspace = true
