[package]
license = "Apache-2.0"
name = "nexus-subagent-resolution"
version = "0.1.0"
edition.workspace = true
description = "Subagent configuration resolution: merges persona, role, and spawn-time overrides into a resolved spec"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
nexus-sampling-types = { path = "../nexus-sampling-types" }
nexus-tools = { path = "../nexus-tools" }
nexus-tool-types.workspace = true
# TODO(phase2): add these when resolve_subagent_spec() composition is implemented:
# nexus-agent = { path = "../nexus-agent" }  # AgentDefinition lookup
# nexus-fast-worktree = { path = "../nexus-fast-worktree" }  # worktree creation

[dev-dependencies]
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
