# electron-builder config for the Nexus desktop shell.
appId: com.nexus.desktop
productName: Nexus
directories:
  output: release
  buildResources: resources
files:
  - dist-electron/**/*
  - package.json
  - resources/**/*
# The agent server binary + the built web UI travel as resources; main.ts
# spawns the binary with NEXUS_WEB_DIR pointed at <resourcesPath>/web.
extraResources:
  - from: ../nexus/target/debug/nexus.exe
    to: bin/nexus.exe
  - from: ../nexus-web/dist
    to: web
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
