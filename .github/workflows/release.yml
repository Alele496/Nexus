name: Release

# CD: triggered by version tags (v*), builds and publishes GitHub Release.
# Usage: git tag v0.3.0 && git push --tags
#
# Artifact naming: nexus-{version}-{os}-{arch}[.exe]
# Matches the auto-update download pattern in nexus-update crate.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Windows x86_64 ─────────────────────────────────────────────
  release-windows:
    runs-on: windows-2022
    env:
      TMP: C:/tmp
      TEMP: C:/tmp
      TMPDIR: C:/tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: win-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: win-cargo-

      - name: Set env
        shell: bash
        run: |
          mkdir -p C:/tmp
          echo "PROTOC=${{ runner.temp }}/protoc/bin/protoc.exe" >> $GITHUB_ENV

      - name: Build release
        run: cargo build -p nexus-bin --release

      - name: Rename artifact
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ARTIFACT="nexus-${VERSION}-windows-x86_64.exe"
          cp target/release/nexus.exe "${ARTIFACT}"
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus/${{ env.ARTIFACT }}
          append_body: true

  # ── Linux x86_64 ───────────────────────────────────────────────
  release-linux:
    runs-on: ubuntu-24.04
    env:
      TMP: /tmp
      TEMP: /tmp
      TMPDIR: /tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libssl-dev

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build release
        run: cargo build -p nexus-bin --release

      - name: Rename artifact
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ARTIFACT="nexus-${VERSION}-linux-x86_64"
          cp target/release/nexus "${ARTIFACT}"
          chmod +x "${ARTIFACT}"
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus/${{ env.ARTIFACT }}
          append_body: true

  # ── macOS ARM64 (Apple Silicon) ─────────────────────────────────
  release-macos:
    runs-on: macos-latest
    env:
      TMP: /tmp
      TEMP: /tmp
      TMPDIR: /tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install system deps
        run: brew install protobuf

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build release
        run: cargo build -p nexus-bin --release

      - name: Rename artifact
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ARTIFACT="nexus-${VERSION}-macos-aarch64"
          cp target/release/nexus "${ARTIFACT}"
          chmod +x "${ARTIFACT}"
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus/${{ env.ARTIFACT }}
          append_body: true
