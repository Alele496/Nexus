name: Release

# CD: triggered by version tags (v*), builds and publishes GitHub Release.
# Usage: git tag v0.3.0 && git push --tags
#
# Artifact naming: nexus-{version}-{os}-{arch}[.exe]
# Matches the auto-update download pattern in nexus-update crate.
#
# Windows code signing is wired but dormant until SignPath Foundation approval
# (free for OSS, no regional restriction). After approval, add these repo
# secrets and the Windows job automatically signs the exe before packaging:
#   SIGNPATH_API_TOKEN       SignPath submitter API key
#   SIGNPATH_ORGANIZATION_ID SignPath organization ID
#   SIGNPATH_PROJECT_SLUG    SignPath project slug
#   SIGNPATH_POLICY_SLUG     SignPath signing policy slug

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: read  # SignPath action downloads the uploaded artifact from Actions

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # ── Windows x86_64 ─────────────────────────────────────────────
  release-windows:
    runs-on: windows-2022
    env:
      TMP: C:/tmp
      TEMP: C:/tmp
      TMPDIR: C:/tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: win-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: win-cargo-

      - name: Set env
        shell: bash
        run: |
          mkdir -p C:/tmp
          echo "PROTOC=${{ runner.temp }}/protoc/bin/protoc.exe" >> $GITHUB_ENV

      - name: Build release
        run: cargo build -p nexus-bin --release --locked

      # ── Windows code signing (SignPath Foundation, free for OSS) ──
      # Active only when SIGNPATH_API_TOKEN is configured. The unsigned exe is
      # uploaded as a GitHub artifact, SignPath signs it and hands the signed
      # binary back; without the secrets this block is skipped entirely and
      # the job ships the unsigned exe exactly as before.
      - name: Upload unsigned binary to artifacts
        id: upload-unsigned
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: nexus-unsigned-exe
          path: target/release/nexus.exe
          retention-days: 1

      - name: Submit signing request to SignPath
        id: signpath
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        uses: SignPath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ secrets.SIGNPATH_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          output-artifact-directory: target/release/signed
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 1800

      - name: Swap signed binary into the build output
        if: ${{ secrets.SIGNPATH_API_TOKEN != '' }}
        shell: bash
        run: |
          find target/release/signed -iname 'nexus*.exe' -exec cp -f {} target/release/nexus.exe \;

      - name: Package and rename artifact
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          EXE="nexus-${VERSION}-windows-x86_64.exe"
          ZIP="nexus-${VERSION}-windows-x86_64.zip"
          cp target/release/nexus.exe "${EXE}"
          # Zip the exe so Windows SmartScreen doesn't flag the raw .exe download
          powershell -Command "Compress-Archive -Path '${EXE}' -DestinationPath '${ZIP}' -Force"
          echo "EXE=${EXE}" >> $GITHUB_ENV
          echo "ZIP=${ZIP}" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nexus/${{ env.EXE }}
            nexus/${{ env.ZIP }}
          append_body: true

  # ── Linux x86_64 ───────────────────────────────────────────────
  release-linux:
    runs-on: ubuntu-24.04
    env:
      TMP: /tmp
      TEMP: /tmp
      TMPDIR: /tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libssl-dev

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Build release
        run: cargo build -p nexus-bin --release --locked

      - name: Rename artifact
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ARTIFACT="nexus-${VERSION}-linux-x86_64"
          cp target/release/nexus "${ARTIFACT}"
          chmod +x "${ARTIFACT}"
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus/${{ env.ARTIFACT }}
          append_body: true

  # ── macOS ARM64 (Apple Silicon) ─────────────────────────────────
  release-macos:
    runs-on: macos-latest
    env:
      TMP: /tmp
      TEMP: /tmp
      TMPDIR: /tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Install system deps
        run: brew install protobuf

      - name: Cache cargo home
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: macos-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: macos-cargo-

      - name: Build release
        run: cargo build -p nexus-bin --release --locked

      - name: Rename artifact
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          ARTIFACT="nexus-${VERSION}-macos-aarch64"
          cp target/release/nexus "${ARTIFACT}"
          chmod +x "${ARTIFACT}"
          echo "ARTIFACT=${ARTIFACT}" >> $GITHUB_ENV

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nexus/${{ env.ARTIFACT }}
          append_body: true

  # ── 构建校验：下载资产计算 SHA256，写入 Release 说明 ───────────────
  # 证明链：tag → commit → 固定 toolchain + 构建命令 → 产物哈希。
  # 任何人可下载产物核对哈希（防篡改），或 checkout 同一 commit 自行构建。
  release-verify:
    needs: [release-windows, release-linux, release-macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download assets and compute SHA256
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          COMMIT="${{ github.sha }}"
          WORK=/tmp/nexus-verify
          rm -rf "$WORK" && mkdir -p "$WORK" && cd "$WORK"

          ASSETS="nexus-${VERSION}-windows-x86_64.zip nexus-${VERSION}-windows-x86_64.exe nexus-${VERSION}-linux-x86_64 nexus-${VERSION}-macos-aarch64"
          for asset in $ASSETS; do
            gh release download "${{ github.ref_name }}" -p "$asset" --clobber
          done

          HASH_ROWS=""
          for asset in $ASSETS; do
            HASH=$(sha256sum "$asset" | cut -d' ' -f1)
            HASH_ROWS="${HASH_ROWS}| \`${asset}\` | \`${HASH}\` |"$'\n'
          done

          VERIFY_BODY=$(cat <<EOF
          ## 构建校验

          本发布由源码构建，证据链：

          | 项 | 值 |
          |----|-----|
          | 源码 tag | \`${{ github.ref_name }}\`
          | 源码 commit | \`${COMMIT}\`
          | 构建环境 | GitHub Actions（windows-2022 / ubuntu-24.04 / macos-latest） |
          | Rust toolchain | 1.92.0（\`rust-toolchain.toml\` 固定） |
          | 构建命令 | \`cargo build -p nexus-bin --release --locked\` |

          校验方法：下载后运行 \`sha256sum <文件>\`（Windows：\`certutil -hashfile <文件> SHA256\`）对比下方哈希；深度验证可 \`git checkout ${COMMIT}\` 后按构建命令自行编译，比对产物哈希。

          | 文件 | SHA256 |
          |------|--------|
          ${HASH_ROWS}
          EOF
          )

          # GitHub only exposes PATCH on /releases/{id} (numeric), not the
          # by-tag route, so grab the release id from the GET we already make.
          RELEASE_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${{ github.ref_name }}")
          EXISTING=$(printf '%s' "$RELEASE_JSON" | jq -r '.body // ""')
          RELEASE_ID=$(printf '%s' "$RELEASE_JSON" | jq -r '.id')
          NEW_BODY=$(printf '%s\n\n%s' "$EXISTING" "$VERIFY_BODY")
          jq -n --arg b "$NEW_BODY" '{body:$b}' > /tmp/nexus-verify/body.json
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input /tmp/nexus-verify/body.json
