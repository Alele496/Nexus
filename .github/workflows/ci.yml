name: CI

on:
  push:
    branches: [main, master, agent-dev]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Windows: check + test ──────────────────────────────────────
  check-windows:
    runs-on: windows-2022
    env:
      # Override .cargo/config.toml [env] Windows paths for CI
      TMP: C:/tmp
      TEMP: C:/tmp
      TMPDIR: C:/tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo home (registry + git)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: win-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: win-cargo-

      - name: Create TMP dir + set PROTOC
        shell: bash
        run: |
          mkdir -p C:/tmp
          echo "PROTOC=${{ runner.temp }}/protoc/bin/protoc.exe" >> $GITHUB_ENV

      - name: Install ripgrep
        shell: bash
        run: |
          mkdir -p C:/tmp/rg
          curl -fsSL -o C:/tmp/rg/ripgrep.zip "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip"
          unzip -o C:/tmp/rg/ripgrep.zip -d C:/tmp/rg
          cp C:/tmp/rg/ripgrep-*/rg.exe C:/tmp/rg/
          echo "C:/tmp/rg" >> $GITHUB_PATH

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test (lib only)
        run: cargo test --workspace --lib --no-fail-fast

  # ── Linux: check + test ────────────────────────────────────────
  check-linux:
    runs-on: ubuntu-24.04
    env:
      # Override .cargo/config.toml [env] Windows paths for CI
      TMP: /tmp
      TEMP: /tmp
      TMPDIR: /tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libssl-dev

      - name: Cache cargo home (registry + git)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test (lib only)
        run: cargo test --workspace --lib --no-fail-fast
