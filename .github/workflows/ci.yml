name: CI

on:
  push:
    branches: [main, master, agent-dev]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Windows: check + test ──────────────────────────────────────
  check-windows:
    runs-on: windows-2022
    env:
      # Override .cargo/config.toml [env] Windows paths for CI
      TMP: C:/tmp
      TEMP: C:/tmp
      TMPDIR: C:/tmp
      # Disable legacy glyph fallback (CI runner can handle Unicode)
      NEXUS_FORCE_LEGACY_CONSOLE: "0"
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          version: "27.2"
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache cargo home (registry + git)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: win-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: win-cargo-

      - name: Create TMP dir + set PROTOC
        shell: bash
        run: |
          mkdir -p C:/tmp
          echo "PROTOC=${{ runner.temp }}/protoc/bin/protoc.exe" >> $GITHUB_ENV

      - name: Install ripgrep
        shell: pwsh
        run: |
          $rgDir = "C:/tmp/rg"
          New-Item -ItemType Directory -Force -Path $rgDir | Out-Null
          $zipPath = "$rgDir/ripgrep.zip"
          Invoke-WebRequest -Uri "https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-x86_64-pc-windows-msvc.zip" -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $rgDir -Force
          $extractedDir = Get-ChildItem -Directory -Path $rgDir | Where-Object { $_.Name -like "ripgrep-*" } | Select-Object -First 1
          Copy-Item -Path "$($extractedDir.FullName)/rg.exe" -Destination "$rgDir/rg.exe"
          Add-Content -Path $env:GITHUB_PATH -Value "C:/tmp/rg"

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test (all, non-blocking)
        run: cargo test --workspace --lib --no-fail-fast
        continue-on-error: true

      - name: Cargo test (nexus-pager, strict)
        run: cargo test -p nexus-pager --lib --no-fail-fast

      - name: Cargo test (nexus-shell, strict)
        run: cargo test -p nexus-shell --lib --no-fail-fast

      - name: Cargo test (nexus-agent, strict)
        run: cargo test -p nexus-agent --lib --no-fail-fast

  # ── Dependency security audit ─────────────────────────────────
  # Scans Cargo.lock against the rustsec advisory database.
  # A vulnerable dependency fails CI, so regressions can't be merged silently.
  audit:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo audit binary
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-${{ runner.os }}

      - name: Install cargo-audit
        run: |
          if [ ! -f ~/.cargo/bin/cargo-audit ]; then
            cargo install cargo-audit --locked
          fi
          cargo audit --version

      # cargo-audit has no config-file support, so the ignore list is read
      # from nexus/deny.toml (single source of truth, each entry carries a
      # justification). Anything not listed there fails this job.
      - name: Run cargo audit
        run: |
          set -euo pipefail
          IGNORES="$(sed -n 's/^[[:space:]]*"\(RUSTSEC-[0-9-]*\)",/\1/p' deny.toml | sed 's/^/--ignore /' | tr '\n' ' ')"
          echo "ignoring: ${IGNORES}"
          cargo audit ${IGNORES}

  # ── SBOM / provenance (release tags only) ──────────────────────
  # Emits a complete dependency inventory + commit-attested provenance
  # into GitHub Artifacts so every release can be traced back to the
  # exact dependency tree and toolchain it was built from.
  sbom:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Generate dependency inventory (cargo tree)
        run: cargo tree --workspace --prefix none > deps.txt

      - name: Generate build provenance
        run: |
          echo "commit: ${{ github.sha }}" > provenance.txt
          echo "tag: ${{ github.ref_name }}" >> provenance.txt
          echo "rustc: $(rustc --version)" >> provenance.txt
          echo "cargo: $(cargo --version)" >> provenance.txt
          echo "built_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)" >> provenance.txt
          wc -l deps.txt | awk '{print "dependency_count: " $1}' >> provenance.txt

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-provenance
          path: |
            nexus/deps.txt
            nexus/provenance.txt
  check-linux:
    runs-on: ubuntu-24.04
    env:
      # Override .cargo/config.toml [env] Windows paths for CI
      TMP: /tmp
      TEMP: /tmp
      TMPDIR: /tmp
    defaults:
      run:
        working-directory: nexus
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Install system deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq protobuf-compiler libssl-dev ripgrep

      - name: Cache cargo home (registry + git)
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: linux-cargo-${{ hashFiles('nexus/Cargo.lock') }}
          restore-keys: linux-cargo-

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo test (all, non-blocking)
        run: cargo test --workspace --lib --no-fail-fast
        continue-on-error: true

      - name: Cargo test (nexus-pager, strict)
        run: cargo test -p nexus-pager --lib --no-fail-fast

      - name: Cargo test (nexus-shell, strict)
        run: cargo test -p nexus-shell --lib --no-fail-fast

      - name: Cargo test (nexus-agent, strict)
        run: cargo test -p nexus-agent --lib --no-fail-fast
